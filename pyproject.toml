[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadgis"
version = "0.1.0"
description = "Fully local, open-source lead-generation desktop tool for 2GIS-listed businesses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LeadGis contributors" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "anthropic>=0.30",
    "phonenumbers>=8.13",
    "openpyxl>=3.1",
    "structlog>=24.1",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
scraper = ["playwright>=1.44"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
leadgis = "leadgis.cli:app"

[tool.hatch.build]
# leadgis/webui/ is a gitignored build artifact (built by `npm run build` in
# frontend/, see README) — hatchling's default VCS-aware file list excludes
# it, so it must be force-included to ship inside the wheel.
artifacts = ["leadgis/webui/**"]

[tool.hatch.build.targets.wheel]
packages = ["leadgis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "ASYNC", "UP", "B"]
# B008: FastAPI's Depends()/Query() default-argument pattern is idiomatic, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/", "frontend/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "types-openpyxl>=3.1.5.20260518",
]
